<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Heritage-LAB WebAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Pannello dell'interfaccia */
        #interface {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;

            padding: 20px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            z-index: 1000;
        }

        #interface h1 {
            margin: 0 0 8px 0;
            font-size: 22px;
        }

        #interface p {
            margin: 0 0 15px 0;
            font-size: 15px;
        }

        .button {
            display: inline-block;

            padding: 12px 18px;
            margin-right: 8px;

            border-radius: 8px;
            border: none;

            background: white;
            color: black;

            text-decoration: none;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        /* Messaggio iniziale */
        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            color: white;

            z-index: 2000;

            font-size: 18px;
        }
    </style>
</head>


<body>

    <!-- Schermata iniziale -->
    <div id="loading">
        Avvio della realtà aumentata...
    </div>


    <!-- Interfaccia -->
    <div id="interface">

        <h1>Clarence Bicknell</h1>

        <p>
            Inquadra l'immagine per visualizzare il modello 3D.
        </p>

        <!-- Link esterno -->
        <a
            class="button"
            href="https://www.project-miage.it/"
            target="_blank"
            rel="noopener noreferrer">
            Visita il sito
        </a>

        <!-- Esempio di altro pulsante -->
        <a
            class="button"
            href="https://sketchfab.com/"
            target="_blank"
            rel="noopener noreferrer">
            Modello 3D
        </a>

    </div>


    <!-- SCENA AR -->
    <a-scene
        mindar-image="
            imageTargetSrc: ./targets.mind;
            maxTrack: 1;
            uiLoading: no;
            uiScanning: no;
            uiError: no;
        "
        embedded
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">


        <!-- Camera -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- Target -->
        <a-entity mindar-image-target="targetIndex: 0">


            <!-- MODELLO 3D -->

            <a-gltf-model
                src="./Pisa_Chiragra.glb"

                position="0 0 0"

                rotation="0 0 0"

                scale="0.5 0.5 0.5">
            </a-gltf-model>


        </a-entity>

    </a-scene>


    <script>

        const loading = document.getElementById("loading");

        const scene = document.querySelector("a-scene");


        /*
         * Quando MindAR è pronto,
         * eliminiamo la schermata di caricamento.
         */

        scene.addEventListener("arReady", function () {

            loading.style.display = "none";

        });


        /*
         * Se l'immagine viene riconosciuta.
         */

        const target = document.querySelector(
            "[mindar-image-target]"
        );


        target.addEventListener("targetFound", function () {

            console.log("Immagine riconosciuta!");

        });


        /*
         * Se l'immagine non è più visibile.
         */

        target.addEventListener("targetLost", function () {

            console.log("Immagine persa.");

        });

    </script>

</body>
</html>
